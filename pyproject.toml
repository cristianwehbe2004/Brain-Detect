[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-detect"
version = "0.1.0"
description = "Dataset preparation utilities for multi-modal brain MRI segmentation."
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.8",
    "monai>=1.3",
    "nibabel>=5.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
